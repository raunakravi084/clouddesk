[project]
name = "clouddesk"
version = "0.1.0"
description = "CloudDesk autonomous customer support and resolution platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
